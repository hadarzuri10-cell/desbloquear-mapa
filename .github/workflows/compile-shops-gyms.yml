name: Compile independent shops and gyms CLEO

on:
  workflow_dispatch:
  push:
    branches:
      - v1.4.1-development
    paths:
      - 'Comercios y gimnasios.csi.source.txt'
      - '.github/workflows/compile-shops-gyms.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Sanny Builder 4.2.0
        shell: pwsh
        run: |
          $url = 'https://github.com/sannybuilder/dev/releases/download/v4.2.0/SannyBuilder-v4.2.0.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sanny.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\sanny.zip" -DestinationPath "$env:RUNNER_TEMP\sanny" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sanny" -Filter sanny.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'sanny.exe was not found.' }
          "SANNY_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile independent source
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'Comercios y gimnasios.csi.source.txt'
          $outputDir = Join-Path $PWD 'build\cleo'
          $output = Join-Path $outputDir 'Comercios y gimnasios.csi'
          New-Item -ItemType Directory -Force -Path $outputDir | Out-Null
          if (-not (Test-Path $source)) { throw "Source file missing: $source" }

          $arguments = @('--no-splash', '--game', 'sa_mobile', '--compile', "`"$source`"", "`"$output`"")
          $process = Start-Process -FilePath $env:SANNY_EXE -ArgumentList $arguments -WorkingDirectory $PWD -PassThru -NoNewWindow -Wait
          if ($process.ExitCode -ne 0) { throw "Compilation failed with exit code $($process.ExitCode)." }
          if (-not (Test-Path $output)) { throw 'Compiler exited without producing the .csi file.' }

          "Compiled independent shops and gyms script." | Set-Content (Join-Path $PWD 'build\compile-result.txt')

      - name: Upload independent script
        uses: actions/upload-artifact@v4
        with:
          name: Comercios-y-gimnasios-compiled
          path: build/*
          if-no-files-found: error
