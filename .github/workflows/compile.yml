name: Compile CLEO script

on:
  workflow_dispatch:
  push:
    branches:
      - fix/1.4.5-property-flags-index
    paths:
      - 'Desbloquear Mapa v1.4.5.source.txt'
      - '.github/workflows/compile.yml'

permissions:
  contents: read

jobs:
  compile:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Download Sanny Builder 4.2.0
        shell: pwsh
        run: |
          $url = 'https://github.com/sannybuilder/dev/releases/download/v4.2.0/SannyBuilder-v4.2.0.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\sanny.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\sanny.zip" -DestinationPath "$env:RUNNER_TEMP\sanny" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\sanny" -Filter sanny.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw 'sanny.exe was not found.' }
          "SANNY_EXE=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile CLEO source (120-second limit)
        shell: pwsh
        run: |
          $source = Join-Path $PWD 'Desbloquear Mapa v1.4.5.source.txt'
          $output = Join-Path $PWD 'build\Desbloquear Mapa.csi'
          $stdout = Join-Path $PWD 'build\compiler-stdout.log'
          $stderr = Join-Path $PWD 'build\compiler-stderr.log'
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Remove-Item $output -ErrorAction SilentlyContinue

          if (-not (Test-Path $source)) { throw "Source file missing: $source" }
          $sourceHash = (Get-FileHash -Path $source -Algorithm SHA256).Hash.ToLowerInvariant()
          "Source SHA256: $sourceHash" | Set-Content build\source-sha256.txt

          $arguments = @(
            '--no-splash',
            '--game', 'sa_mobile',
            '--compile',
            "`"$source`"",
            "`"$output`""
          )

          "Compiler: $env:SANNY_EXE" | Set-Content build\compile.log
          "Arguments: $($arguments -join ' ')" | Add-Content build\compile.log
          "Source SHA256: $sourceHash" | Add-Content build\compile.log

          $process = Start-Process -FilePath $env:SANNY_EXE -ArgumentList $arguments -WorkingDirectory $PWD -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            $process.WaitForExit()
            'ERROR: Sanny Builder exceeded the 120-second compilation limit.' | Add-Content build\compile.log
            throw 'Sanny Builder timed out after 120 seconds.'
          }

          "Exit code: $($process.ExitCode)" | Add-Content build\compile.log
          if (Test-Path $stdout) { Get-Content $stdout | Add-Content build\compile.log }
          if (Test-Path $stderr) { Get-Content $stderr | Add-Content build\compile.log }

          $sannyLog = Join-Path (Split-Path $env:SANNY_EXE) 'compile.log'
          if (Test-Path $sannyLog) {
            Copy-Item $sannyLog build\sanny-compile.log -Force
            Get-Content $sannyLog | Add-Content build\compile.log
          }

          if ($process.ExitCode -ne 0) { throw "Compilation failed with exit code $($process.ExitCode)." }
          if (Test-Path 'build\sanny-compile.log') {
            $compilerErrors = Select-String -Path 'build\sanny-compile.log' -Pattern '(?i)^\s*error:'
            if ($compilerErrors) {
              Remove-Item $output -ErrorAction SilentlyContinue
              $sourceText = Get-Content $source -Raw
              $diagnosticSource = Join-Path $PWD 'build\diagnostic-without-property32.txt'
              $diagnosticOutput = Join-Path $PWD 'build\diagnostic-without-property32.csi'
              $pattern = '(?ms)^0004: 0@ = 32\r?\n.*?^:prop_skip_32\r?\n'
              $diagnosticText = [regex]::Replace($sourceText, $pattern, ":prop_skip_32`r`n")
              if ($diagnosticText -ne $sourceText) {
                Set-Content -Path $diagnosticSource -Value $diagnosticText -NoNewline
                Remove-Item $diagnosticOutput -ErrorAction SilentlyContinue
                Remove-Item $sannyLog -ErrorAction SilentlyContinue
                $diagnosticArguments = @('--no-splash', '--game', 'sa_mobile', '--compile', "`"$diagnosticSource`"", "`"$diagnosticOutput`"")
                $diagnosticProcess = Start-Process -FilePath $env:SANNY_EXE -ArgumentList $diagnosticArguments -WorkingDirectory $PWD -PassThru -NoNewWindow -RedirectStandardOutput (Join-Path $PWD 'build\diagnostic-stdout.log') -RedirectStandardError (Join-Path $PWD 'build\diagnostic-stderr.log')
                if ($diagnosticProcess.WaitForExit(120000)) {
                  "Diagnostic compile without property 32 exit code: $($diagnosticProcess.ExitCode)" | Add-Content build\compile.log
                  if (Test-Path $sannyLog) {
                    Copy-Item $sannyLog build\diagnostic-sanny-compile.log -Force
                    Get-Content $sannyLog | Add-Content build\compile.log
                  }
                } else {
                  $diagnosticProcess.Kill()
                  'Diagnostic compile without property 32 timed out.' | Add-Content build\compile.log
                }
              } else {
                'Could not isolate property block 32 for diagnostic compile.' | Add-Content build\compile.log
              }
              throw "Sanny Builder reported compilation errors. See build/sanny-compile.log and diagnostic logs."
            }
          }
          if (-not (Test-Path $output)) { throw 'Compiler exited without producing the .csi file.' }

          Copy-Item 'Desbloquear Mapa.fxt' build\
          Copy-Item 'VALIDACION_ESTATICA.txt' build\

      - name: Upload build diagnostics and artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Desbloquear-Mapa-v1.4.5-indexfix-compiled-test
          path: build/*
          if-no-files-found: warn
